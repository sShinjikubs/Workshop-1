<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_58" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160924" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="lightSpot_58" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#160924" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_58" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="600" height="500" fill="url(#bgGrad_58)" />
  <circle cx="300" cy="230" r="220" fill="url(#lightSpot_58)" />

  <!-- Studio Stage Floor Line -->
  <ellipse cx="300" cy="400" rx="240" ry="35" fill="#000000" opacity="0.45" filter="blur(8px)" />

  <!-- Embedded Realistic Product Photo -->
  <g filter="url(#shadow_58)">
    <image href="/images/audio/bo-beosound.png" x="75" y="45" width="450" height="350" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- Studio Colorway Finish Badge (Top Left) -->
  <rect x="25" y="25" width="160" height="34" rx="17" fill="#2b1245" stroke="#c084fc" stroke-width="1.5" />
  <circle cx="45" cy="42" r="7" fill="#c084fc" />
  <text x="62" y="47" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">DEEP VIOLET</text>

  <!-- Product ID & Brand Tag (Top Right) -->
  <rect x="420" y="25" width="155" height="34" rx="17" fill="#2b1245" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="497" y="47" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="800" fill="#c084fc" text-anchor="middle" letter-spacing="1">#58 BOSE</text>

  <!-- Studio Overlay Vignette & Lighting Rim -->
  <rect width="600" height="500" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.2" />

  <!-- Product Title & Spec Bar at Bottom -->
  <rect x="0" y="435" width="600" height="65" fill="#020617" opacity="0.85" />
  <text x="30" y="462" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Bose Pulse 506 Earbuds</text>
  <text x="570" y="462" font-family="'Inter', system-ui, sans-serif" font-size="17" font-weight="800" fill="#c084fc" text-anchor="end">฿7,990</text>
  <text x="30" y="485" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Bluetooth 5.3 / Spatial Audio • 35 Hours</text>
</svg>
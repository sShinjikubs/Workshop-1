<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0b00" />
      <stop offset="100%" stop-color="#090400" />
    </linearGradient>
    <radialGradient id="spotJBL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1c0b00" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgGrad)" />
  <circle cx="300" cy="225" r="180" fill="url(#spotJBL)" />
  
  <!-- JBL Speaker Body -->
  <g transform="translate(150, 150)">
    <rect x="0" y="20" width="300" height="110" rx="40" fill="#181818" stroke="#ff6b00" stroke-width="4" />
    <!-- Grill texture -->
    <rect x="30" y="30" width="240" height="90" rx="20" fill="#222" stroke="#333" stroke-width="2" />
    <!-- Metallic JBL Logo Badge -->
    <rect x="110" y="55" width="80" height="40" rx="8" fill="#ff6b00" />
    <text x="150" y="83" font-family="'Inter', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">JBL</text>
    <!-- Passive Radiator Caps -->
    <ellipse cx="15" cy="75" rx="12" ry="35" fill="#333" stroke="#ff6b00" stroke-width="3" />
    <ellipse cx="285" cy="75" rx="12" ry="35" fill="#333" stroke="#ff6b00" stroke-width="3" />
  </g>

  <rect x="25" y="25" width="140" height="32" rx="16" fill="#3d1d08" stroke="#ff6b00" stroke-width="1.5" />
  <text x="95" y="46" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#ff8c38" text-anchor="middle">JBL FLIP 6</text>
  <text x="300" y="390" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">JBL Flip 6 Portable Bluetooth Speaker</text>
  <text x="300" y="415" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ff8c38" text-anchor="middle">฿5,190 • IP67 Waterproof • 12 Hours Battery</text>
</svg>
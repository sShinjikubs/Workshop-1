    <ellipse cx="20" cy="100" rx="14" ry="45" fill="#ec4899" />
    <ellipse cx="180" cy="100" rx="14" ry="45" fill="#ec4899" />
    <!-- Handle -->
    <path d="M 40 25 Q 100 -20 160 25" fill="none" stroke="#f472b6" stroke-width="12" stroke-linecap="round" />
    <text x="100" y="106" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">DEVIALET</text>
  </g>

  <rect x="25" y="25" width="150" height="32" rx="16" fill="#432659" stroke="#ec4899" stroke-width="1.5" />
  <text x="100" y="46" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#f472b6" text-anchor="middle">DEVIALET MANIA</text>
  <text x="300" y="390" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Devialet Mania Portable Smart Speaker</text>
  <text x="300" y="415" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f472b6" text-anchor="middle">฿38,900 • 360° Stereo • 10 Hours Battery</text>

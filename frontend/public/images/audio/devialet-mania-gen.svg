<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1029" />
      <stop offset="100%" stop-color="#09030d" />
    </linearGradient>
    <radialGradient id="spotDev" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1029" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgGradDev)" />
  <circle cx="300" cy="225" r="180" fill="url(#spotDev)" />

  <!-- Devialet Spherical Speaker -->
  <g transform="translate(200, 130)">
    <circle cx="100" cy="100" r="90" fill="#301b40" stroke="#ec4899" stroke-width="4" />

  <!-- Grid accent lines -->
  <line x1="0" y1="330" x2="500" y2="330" stroke="#3c341d" stroke-width="2" opacity="0.5" />
  
  <!-- Brand Badge Top -->
  <rect x="30" y="25" width="130" height="32" rx="16" fill="#3c341d" stroke="#eab308" stroke-width="1.5" />
  <text x="95" y="46" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="800" fill="#facc15" text-anchor="middle" letter-spacing="1">SHURE</text>


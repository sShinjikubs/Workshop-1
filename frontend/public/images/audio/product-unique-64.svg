      <stop offset="0%" stop-color="#16130b" />
      <stop offset="100%" stop-color="#292314" />
    </linearGradient>
    <radialGradient id="radial_64" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#16130b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="400" fill="url(#grad_64)" />

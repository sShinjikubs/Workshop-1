  <text x="410" y="46" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#eab308" text-anchor="middle" letter-spacing="1"># 64 EARBUDS</text>

  <!-- Central Graphic -->
  
      <!-- Earbuds Graphics -->
      <g transform="translate(180, 160)">
        <ellipse cx="40" cy="40" rx="30" ry="22" fill="#eab308" />
        <rect x="30" y="55" width="14" height="40" rx="7" fill="#eab308" />
        <circle cx="32" cy="38" r="8" fill="#16130b" />
      </g>
      <g transform="translate(260, 160)">
        <ellipse cx="40" cy="40" rx="30" ry="22" fill="#eab308" />

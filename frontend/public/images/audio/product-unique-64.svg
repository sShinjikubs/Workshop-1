        <circle cx="48" cy="38" r="8" fill="#16130b" />
      </g>
      <!-- Case Outline -->
      <rect x="185" y="240" width="130" height="70" rx="25" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="6,4" opacity="0.6" />
    

  <!-- Model Title Bottom -->
  <text x="250" y="340" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Shure Master 548 Earbuds</text>
  <text x="250" y="365" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#eab308" text-anchor="middle">฿15,790 • Bluetooth 5.3 / Spatial Audio</text>

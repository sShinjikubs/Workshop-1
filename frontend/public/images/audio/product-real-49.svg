<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_49" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18100a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="lightSpot_49" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#18100a" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow_49" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="600" height="500" fill="url(#bgGrad_49)" />
  <circle cx="300" cy="230" r="220" fill="url(#lightSpot_49)" />

  <!-- Studio Stage Floor Line -->
  <ellipse cx="300" cy="400" rx="240" ry="35" fill="#000000" opacity="0.45" filter="blur(8px)" />

  <!-- Embedded Realistic Product Photo -->
  <g filter="url(#shadow_49)">
    <image href="/images/audio/marshall-motif.png" x="75" y="45" width="450" height="350" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- Studio Colorway Finish Badge (Top Left) -->
  <rect x="25" y="25" width="160" height="34" rx="17" fill="#332014" stroke="#fb923c" stroke-width="1.5" />
  <circle cx="45" cy="42" r="7" fill="#fb923c" />
  <text x="62" y="47" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="0.5">COPPER BRONZE</text>

  <!-- Product ID & Brand Tag (Top Right) -->
  <rect x="420" y="25" width="155" height="34" rx="17" fill="#332014" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="497" y="47" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="800" fill="#fb923c" text-anchor="middle" letter-spacing="1">#49 B&O</text>

  <!-- Studio Overlay Vignette & Lighting Rim -->
  <rect width="600" height="500" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.2" />

  <!-- Product Title & Spec Bar at Bottom -->
  <rect x="0" y="435" width="600" height="65" fill="#020617" opacity="0.85" />
  <text x="30" y="462" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">B&O Signature Edition 443 Earbuds</text>
  <text x="570" y="462" font-family="'Inter', system-ui, sans-serif" font-size="17" font-weight="800" fill="#fb923c" text-anchor="end">฿31,290</text>
  <text x="30" y="485" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Bluetooth 5.4 / Snapdragon Sound • 35 Hours</text>
</svg>